<header [ngClass]="{ scrolled: isScrolled(), 'menu-open': menuOpen() }">
  <div class="container header-content">
    <a class="logo" (click)="scrollTo('hero')">
      <img src="https://www.bur.org.ua/wp-content/uploads/2025/02/Asset-2.png" alt="BUR Kyiv" class="logo-img">
    </a>

    <div class="header-right">
      <div class="header-top">
        <ul class="header-nav">
          <li><a (click)="scrollTo('about')">Про нас</a></li>
          <li><a (click)="scrollTo('projects')">Проєкти</a></li>
          <li><a (click)="scrollTo('results')">Результати</a></li>
          <li><a (click)="scrollTo('team')">Команда</a></li>
          <li><a (click)="scrollTo('gallery')">Галерея</a></li>
        </ul>
      </div>
      <div class="header-bot">
        <ul class="header-nav">
          <li><a (click)="scrollTo('contact')">Контакти</a></li>
          <li><a href="https://www.bur.org.ua" target="_blank">BUR Україна</a></li>
        </ul>
      </div>
    </div>

    <button class="hamburger" [ngClass]="{ active: menuOpen() }" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="mobile-nav" [ngClass]="{ active: menuOpen() }">
      <a (click)="scrollTo('about')">Про нас</a>
      <a (click)="scrollTo('projects')">Проєкти</a>
      <a (click)="scrollTo('results')">Результати</a>
      <a (click)="scrollTo('team')">Команда</a>
      <a (click)="scrollTo('gallery')">Галерея</a>
      <a (click)="scrollTo('contact')">Контакти</a>
      <a href="https://www.bur.org.ua" target="_blank">BUR Україна</a>
    </nav>
  </div>
</header>
