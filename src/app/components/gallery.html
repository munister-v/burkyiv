<section id="gallery" class="section gallery">
  <div class="container">
    <div class="gallery-header">
      <h2 class="section-title">Фото <span class="accent">галерея</span></h2>
      <p class="section-subtitle">Моменти нашої спільної роботи</p>
    </div>

    <div class="gallery-grid">
      @for (item of items; track item.label) {
        <div class="gallery-item">
          <div class="gallery-placeholder" [style.background]="'linear-gradient(135deg, ' + item.color + '22, ' + item.color + '44)'">
            <div class="gallery-icon">
              <svg viewBox="0 0 24 24" fill="none" [style.color]="item.color" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </div>
            <span class="gallery-label">{{ item.label }}</span>
          </div>
        </div>
      }
    </div>

    <div class="gallery-note">
      <p>Більше фото та відео на нашому
        <a href="https://www.instagram.com/burkyiv/" target="_blank" rel="noopener noreferrer">Instagram</a>
      </p>
    </div>
  </div>
</section>
